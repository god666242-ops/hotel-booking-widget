<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grand Heritage Resort — Widget demo</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #0c1a21;
        background:
          radial-gradient(900px 500px at 80% -10%, rgb(15 118 110 / 0.16), transparent 60%),
          radial-gradient(700px 480px at -10% 110%, rgb(14 116 144 / 0.14), transparent 60%),
          #f4f7f8;
      }
      .hero { text-align: center; max-width: 640px; }
      .eyebrow { display: inline-block; padding: 6px 14px; border-radius: 999px; background: #fff; border: 1px solid #e1e8eb; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #0f766e; }
      h1 { margin: 18px 0 12px; font-size: clamp(32px, 6vw, 52px); line-height: 1.08; letter-spacing: -0.03em; font-weight: 800; }
      p { margin: 0 0 28px; font-size: 18px; color: #3f4f58; }
    </style>
  </head>
  <body>
    <main class="hero">
      <span class="eyebrow">Goa · Beachfront</span>
      <h1>Welcome to Grand Heritage Resort</h1>
      <p>Luxury beachfront villas and rooms. Book direct for the best rate.</p>
      <!-- The embed tag. Optional: data-primary="#7c3aed"  data-theme="dark"  data-button-label="Reserve now" -->
      <hotel-booking-engine data-primary="#008080" data-theme="light" data-hotel="grand-palms"></hotel-booking-engine>
    </main>

    <script>
      // Demo page served at https://cdn.purebook.in/
      // Both  /  and  /?mock  open the engine with demo data (no backend needed).
      (function () {
        function load(src) {
          return new Promise(function (res, rej) {
            var el = document.createElement('script');
            el.src = src; el.onload = res; el.onerror = rej;
            document.body.appendChild(el);
          });
        }
        import('/mock-api.js')
          .catch(function (e) { console.warn('Demo data failed to load', e); })
          .then(function () { return load('/engine.js'); });
      })();
    </script>
  </body>
</html>
